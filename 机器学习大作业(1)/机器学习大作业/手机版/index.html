<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>南航评论区 · 手机版</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <button class="icon-btn" aria-label="返回">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <div class="brand">南航评论区 手机版</div>
  <div class="spacer"></div>
  <button class="icon-btn" id="topSearchBtn" aria-label="搜索">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
  </button>
  <button class="icon-btn bell" id="notifyBell" aria-label="消息通知">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 7.5a6 6 0 1 0-12 0c0 6-2.5 7.5-2.5 7.5h17S18 13.5 18 7.5z"/><path d="M13.7 20a2 2 0 0 1-3.4 0"/></svg>
    <span class="dot" id="notifyDot"></span>
  </button>
  <span class="user-chip" id="userChip">ewe</span>
  <button class="top-btn" id="authBtn">登录</button>
</header>

<!-- 首页 -->
<main class="page active" id="page-home">
  <section class="hero-card">
    <img class="hero-img" src="主楼-最终.png" alt="南京航空航天大学将军路校区主楼"
         onerror="this.style.display='none'">
    <div class="hero-bubble">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-12.3 7.6L3 21l1.9-5.6A8.5 8.5 0 1 1 21 11.5z"/></svg>
    </div>
    <div class="hero-text">
      <h1>南航评论区 <span class="h1-pin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-5.4-7-11a7 7 0 1 1 14 0c0 5.6-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/></svg></span></h1>
      <p class="hero-sub">校园地图 · 失物招领 · 二手市集 · 校园评论</p>
      <p class="hero-sub2">将军路校区一站式校园社区</p>
    </div>
    <div class="hero-stats" id="homeStats"></div>
  </section>
  <div class="card ml-card" id="homeMl"></div>
  <div class="mod-row">
    <div class="mod" onclick="M.switchTab('map')">
      <div class="mod-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-5.4-7-11a7 7 0 1 1 14 0c0 5.6-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/></svg></div>
      <h3>校园地图</h3><p>逛遍校园每个地点，看评论发点评</p>
    </div>
    <div class="mod" onclick="M.switchTab('lost')">
      <div class="mod-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="7.5" width="15" height="12" rx="3"/><path d="M9 7.5V5.8A3 3 0 0 1 15 5.8v1.7"/><path d="M4.5 12.5h15"/></svg></div>
      <h3>失物招领</h3><p>丢了东西？捡到东西？来这里喊一声</p>
    </div>
    <div class="mod" onclick="M.switchTab('market')">
      <div class="mod-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 8h11l1 12h-13l1-12z"/><path d="M9.5 8V6.2a2.5 2.5 0 0 1 5 0V8"/></svg></div>
      <h3>二手市集</h3><p>教材、数码、生活用品，捡漏好去处</p>
    </div>
    <div class="mod" onclick="M.switchTab('forum')">
      <div class="mod-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-12.3 7.6L3 21l1.9-5.6A8.5 8.5 0 1 1 21 11.5z"/></svg></div>
      <h3>校园评论</h3><p>学习、食堂、选课，畅所欲言</p>
    </div>
  </div>
</main>

<!-- 地图 -->
<main class="page" id="page-map">
  <div class="search-bar">
    <span>🔍</span>
    <input id="mSearch" placeholder="搜索地点，如：图书馆 / 一食堂">
  </div>
  <div id="mMap"><div class="fallback" id="mapFallback">地图加载失败<br>（需在腾讯地图控制台把本站地址加入 key 白名单）</div></div>
  <div class="map-actions">
    <button class="btn" onclick="M.map.locate()">📍 我的位置</button>
    <button class="btn ghost" onclick="M.map.pick()">🎯 点到哪看哪</button>
  </div>
  <div class="page-title" style="margin-top:14px">📍 附近地点</div>
  <div id="mPoiList"></div>
</main>

<!-- 失物招领 -->
<main class="page" id="page-lost">
  <div class="search-bar"><span>🔍</span><input id="lfSearch" placeholder="搜索标题 / 地点"></div>
  <div class="chips" id="lfChips">
    <button class="chip active" data-k="">全部</button>
    <button class="chip" data-k="lost">🔍 寻物</button>
    <button class="chip" data-k="found">🎁 招领</button>
  </div>
  <div class="grid2" id="lfGrid"></div>
</main>

<!-- 二手市集 -->
<main class="page" id="page-market">
  <div class="search-bar"><span>🔍</span><input id="mkSearch" placeholder="搜索商品，如：笔记本 / 单车"></div>
  <div class="sem-row">
    <button class="sem-switch on" id="mkSemSwitch" onclick="M.market.toggleSem()">语义检索</button>
    <span class="sem-tip" id="mkSemTip">支持同义词、错别字与相关词扩展</span>
  </div>
  <div class="chips" id="mkChips">
    <button class="chip active" data-k="">全部</button>
    <button class="chip" data-k="sell">💰 出售</button>
    <button class="chip" data-k="want">🛒 求购</button>
  </div>
  <div class="grid2" id="mkGrid"></div>
</main>

<!-- 校园评论 -->
<main class="page" id="page-forum">
  <div class="search-bar"><span>🔍</span><input id="fmSearch" placeholder="搜索帖子"></div>
  <div id="fmList"></div>
</main>

<!-- 悬浮发布按钮：固定在底部，不随内容滚动 -->
<button class="fab" id="fabLost" onclick="M.lost.openCreate()">＋ 发布失物</button>
<button class="fab" id="fabMarket" onclick="M.market.openCreate()">＋ 发布</button>
<button class="fab" id="fabForum" onclick="M.forum.openCreate()">＋ 发帖</button>

<!-- 底部 Tab -->
<nav class="tabbar">
  <button class="tab active" data-tab="home"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.2V21h13V9.2"/></svg></span>首页</button>
  <button class="tab" data-tab="map"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 7v13l6-3 6 3 6-3V4l-6 3-6-3z"/><path d="M9 4v13"/><path d="M15 7v13"/></svg></span>地图</button>
  <button class="tab" data-tab="lost"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="7.5" width="15" height="12" rx="3"/><path d="M9 7.5V5.8A3 3 0 0 1 15 5.8v1.7"/><path d="M4.5 12.5h15"/></svg></span>失物</button>
  <button class="tab" data-tab="market"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 8h11l1 12h-13l1-12z"/><path d="M9.5 8V6.2a2.5 2.5 0 0 1 5 0V8"/></svg></span>市集</button>
  <button class="tab" data-tab="forum"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-12.3 7.6L3 21l1.9-5.6A8.5 8.5 0 1 1 21 11.5z"/></svg></span>论坛</button>
</nav>

<!-- 通用详情抽屉 -->
<div class="sheet-mask" id="sheetMask" onclick="M.sheet.close()"></div>
<div class="sheet" id="sheet">
  <div class="bar"></div>
  <div class="sheet-head">
    <div class="sheet-head-title" id="sheetTitle"></div>
    <button class="x" onclick="M.sheet.close()">✕</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<!-- 全屏表单 -->
<div class="modal" id="formModal">
  <div class="m-head">
    <span id="formTitle">表单</span>
    <button class="x" onclick="M.form.close()">✕</button>
  </div>
  <div class="m-body" id="formBody"></div>
</div>

<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
